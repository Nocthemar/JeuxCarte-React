# =====================================================================
#  Mise en ligne du jeu sur GitHub Pages
#  À chaque envoi sur la branche main (ou à la main, onglet « Actions ») : GitHub installe les
#  dépendances, lance les tests, construit le jeu (npm run build -> dist/) et publie dist/.
#
#  L'adresse et la clé PUBLIQUE de Supabase viennent des « Variables » du dépôt
#  (Settings > Secrets and variables > Actions > onglet Variables) :
#    VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   (jamais la clé secrète)
# =====================================================================
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois (le plus récent l'emporte)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Construire le jeu
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
